name: Run OT-2 Protocol WF

metadata:
  author: Abe Stroka
  info: Workflow for running one OT-2 protocol from payload
  version: '0.1'

parameters:
  file_inputs:
    - key: ot2_protocol

steps:
  # Run OT-2 protocol
  - name: Run OT-2 patrick
    node: ot2_gamma
    action: run_protocol
    files:
      protocol: ot2_protocol