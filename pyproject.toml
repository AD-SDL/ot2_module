[project]
name = "ot2_module"
version = "3.0.0"
description = "MADSci node module for Opentrons OT-2 and Flex liquid handlers"
authors = [
    {name = "Ryan D. Lewis", email="ryan.lewis@anl.gov"},
    {name = "Doga Ozgulbas", email="dozgulbas@anl.gov"},
    {name = "Abe Stroka", email="astroka@anl.gov"},
    {name = "Tobias Ginsburg", email = "tginsburg@anl.gov"},
]
dependencies = [
    "madsci.node_module~=0.8.0",
    "madsci.client~=0.8.0",
    "madsci.common~=0.8.0",
    # Imported by the module but absent from this branch's dependency list. They are
    # present at runtime only because the madsci base image happens to ship them, so
    # the container works and a native pip install fails on first import.
    #   pandas            protopiler/protopiler.py
    #   openpyxl          pandas Excel support, used by the .xlsx test configs
    #   typing_extensions both rest nodes
    "pandas",
    "openpyxl>=3.1.5",
    "typing_extensions"
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
homepage = "https://github.com/AD-SDL/ot2_module"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ipykernel>=6.29.5",
    "pydantic-settings-export>=1.0.3",
]

[tool.pydantic_settings_export]
project_dir = "."
default_settings = [
    "ot2_rest_node:OT2NodeConfig",
]

[[tool.pydantic_settings_export.generators.markdown]]
paths = ["docs/Configuration.md"]

[[tool.pydantic_settings_export.generators.dotenv]]
paths = [".env.example"]

[tool.pdm]
distribution = true

[project.optional-dependencies]
# Opentrons' own simulator, used by simulation mode to execute a compiled protocol
# without a robot. Kept optional because it adds roughly 54 MB and nine packages
# that a production container never imports.
#
# The pin is bounded on BOTH sides and neither bound is arbitrary:
#   9.x and 10.x REFUSE OT-2 protocols. OT-2 support moved to a separate
#     "opentrons-ot2" distribution which is not published on PyPI.
#   7.5 and older break on Python 3.12, they call the removed asyncio.coroutine.
# 8.8.2 handles OT-2 and Flex, up to apiLevel 2.27.
simulation = ["opentrons~=8.8.2"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
